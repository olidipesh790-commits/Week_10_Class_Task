<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9</title>
    <style>
        .even { color: blue;}
        .even { color: red}
    </style>
</head>
<body>
    <button id="generateBtn">Generate numbers</button>
    <div id="numbers"></div>

    <script>
        document.getElementById("generateBtn") .addEventListener("click", function(){
            let html = "";

            for (let i = 1; i <=20; i++){
                if (i % 2 === 0){
                    html += '<span class="even">' + i + '</span>';
                } else {
                    html += '<span class="odd">' + i + '</span>';
                }
            }
            document.getElementById("numbers").innerHTML = html;
        });
    </script>
</body>
</html>

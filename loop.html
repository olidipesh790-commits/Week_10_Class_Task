<!DOCTYPE html>
<html>
<head><title>Q2</title></head>
<body>
<h2>Q2: Numbers 1 to 50 </h2>
<script>
  console.log("Numbers from 1 to 50:");
  for (let i = 1; i <= 50; i++) {
    console.log(i);
  }

  console.log("Numbers divisible by 5:");
  for (let i = 1; i <= 50; i++) {
    if (i % 5 === 0) {
      console.log(i);
    }
  }
</script>
</body>
</html>

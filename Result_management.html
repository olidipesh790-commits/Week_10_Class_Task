<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Result Management System</title>
  <link rel="stylesheet" href="Result_management.css">
</head>
<body>
  <h1>Student Result Management System</h1>

  <div class="form-box">
    <label for="studentName">Student Name</label>
    <input type="text" id="studentName" placeholder="Enter student name">

    <label for="math">Mathematics</label>
    <input type="number" id="math" placeholder="0 - 100">

    <label for="science">Science</label>
    <input type="number" id="science" placeholder="0 - 100">

    <label for="computer">Computer</label>
    <input type="number" id="computer" placeholder="0 - 100">

    <button id="addBtn">Add Student</button>
    <button id="listBtn">Generate Student List</button>
  </div>

  <p id="message"></p>

  <div id="resultSection"></div>

  <script src="Result_management.js"></script>
</body>
</html>
